<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Index Form</title>
    <style>
        .form-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .form-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading-indicator {
            color: #666;
            margin: 10px 0;
        }
        .form-group {
            margin: 10px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Test Index Contact Form</h1>
    
    <div id="formMessage" class="form-message" style="display: none;"></div>
    
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Name" value="Test Index" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Your Email" value="testindex@example.com" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Subject" value="Index Form Test">
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Your Message" required>Testing the updated index.html contact form with inline JavaScript</textarea>
        </div>
        
        <div id="formLoading" class="loading-indicator" style="display: none;">
            Sending your message...
        </div>
        
        <button type="submit" class="btn primary-btn">Send Message</button>
    </form>

    <!-- Simple Contact Form Handler (same as in index.html) -->
    <script>
        console.log('Test index page loaded');
        
        // Simple inline contact form handler (working version)
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            if (contactForm) {
                console.log('Contact form found, adding event listener');
                
                contactForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    console.log('Contact form submitted');
                    
                    // Show loading state
                    const loadingDiv = document.getElementById('formLoading');
                    const messageDiv = document.getElementById('formMessage');
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    
                    loadingDiv.style.display = 'block';
                    messageDiv.style.display = 'none';
                    submitBtn.disabled = true;
                    
                    // Get form data
                    const formData = {
                        name: document.getElementById('name').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        subject: document.getElementById('subject').value.trim(),
                        message: document.getElementById('message').value.trim()
                    };
                    
                    console.log('Sending form data:', formData);
                    
                    try {
                        const response = await fetch('http://localhost:3000/api/contact', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(formData)
                        });
                        
                        console.log('Response status:', response.status);
                        const result = await response.json();
                        console.log('Response data:', result);
                        
                        // Hide loading
                        loadingDiv.style.display = 'none';
                        submitBtn.disabled = false;
                        
                        // Show result message
                        messageDiv.style.display = 'block';
                        if (result.success) {
                            messageDiv.className = 'form-message success';
                            messageDiv.textContent = result.message || 'Message sent successfully!';
                            contactForm.reset(); // Clear form
                        } else {
                            messageDiv.className = 'form-message error';
                            messageDiv.textContent = result.message || 'Failed to send message';
                        }
                        
                        // Hide message after 5 seconds
                        setTimeout(() => {
                            messageDiv.style.display = 'none';
                        }, 5000);
                        
                    } catch (error) {
                        console.error('Contact form error:', error);
                        
                        // Hide loading
                        loadingDiv.style.display = 'none';
                        submitBtn.disabled = false;
                        
                        // Show error message
                        messageDiv.style.display = 'block';
                        messageDiv.className = 'form-message error';
                        messageDiv.textContent = 'Network error. Please try again later.';
                        
                        // Hide message after 5 seconds
                        setTimeout(() => {
                            messageDiv.style.display = 'none';
                        }, 5000);
                    }
                });
            } else {
                console.log('Contact form not found');
            }
        });
    </script>
</body>
</html>
